name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # tests run the real ffmpeg from PATH
      - name: install ffmpeg (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core libwayland-dev libxkbcommon-dev
      - name: install ffmpeg (macos)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: install ffmpeg (windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: cargo test
      - run: cargo build --profile minsizerel

      - name: package
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "dist/ffmpeditor-${{ matrix.name }}.zip" ./target/minsizerel/ffmpeditor.exe ./LICENSE
          else
            tar -czf "dist/ffmpeditor-${{ matrix.name }}.tar.gz" -C target/minsizerel ffmpeditor -C ../.. LICENSE
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One rolling draft per Cargo.toml version, refreshed by every push.
      # Once published, later pushes leave it alone until the version is bumped.
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          notes="main @ $GITHUB_SHA"
          draft=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null || echo none)
          case "$draft" in
            none)
              gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes "$notes" dist/* ;;
            true)
              gh release edit "$tag" --target "$GITHUB_SHA" --notes "$notes"
              gh release upload "$tag" --clobber dist/* ;;
            *)
              echo "::warning::$tag is already published; bump version in Cargo.toml for a new draft" ;;
          esac
